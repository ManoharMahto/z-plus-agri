<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Z+ Agri</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var path = window.location.pathname;
      if (path && path !== '/') {
        window.location.replace('/#' + path);
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting to Z+ Agri...</p>
  </body>
</html>
